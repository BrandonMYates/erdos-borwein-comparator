  notes: 'Reviewed internally, mechanically: the pinned library was rebuilt from a fresh
    checkout against Mathlib v4.32.0; QHarm.master_int was checked with #print axioms to
    depend on exactly propext, Classical.choice and Quot.sound; a comment-stripped scan of
    the library found no sorry, native_decide or axiom declarations. No human expert has
    reviewed the formalization.'
alignment:
  namespace: ErdosBorwein
  statements:
  - source: 'Erdős (1948), Theorem (t = 2); Borwein (1991), Theorem 1 at r = -1; Van
      Assche (2001), the Lambert-series example'
    lean: ErdosBorwein.irrational_qharmonic_int
    module: Challenge
    status: proved
    note: 'The sources state the result for the series sum 1/(q^n - 1) with q an integer
      at least 2 (Erdős: q = 2). The Lean statement quantifies over t : Int with 2 <= t
      and takes the sum in the reals over n : PNat.'
