      scan for sorry, native_decide and axiom declarations -- was performed by a separate
      agent (claude-fable-5). The Challenge, Solution and this metadata were written by
      the same verifying agent.'
    cost:
      wall_time: about two hours of wall-clock for the supporting library, concurrent agents
      spend_usd: subscription-based
      hardware: local Apple Silicon machine
    prompting_notes: 'Three lead-agent sketches were improved or refused by worker agents
      during construction; the most consequential was a degree-gap estimate in the
      dominant-term separation that was correct but understated, replaced by an exact
      subtraction-free identity. One proved bound (the tail estimate) was validated
      against ground-truth high-precision numerics at several bases before being relied
      on. No specification that reached the final library was mathematically wrong.'
  spend_usd: subscription-based
  notes: The mathematics is classical (Erdős, Borwein, Van Assche). The Lean formalization
    is produced by automation under the author's direction and verified mechanically.
fidelity:
  divergences: 'The series is written as a tsum over n : PNat of 1 / ((t : Real)^n - 1)
    with t an integer satisfying 2 <= t; since the terms are positive and summable this
    is the ordinary value of the series. The compared statement is exactly the
    integer-base theorem and nothing more. No other known divergence.'
