sources:
- title: On arithmetical properties of Lambert series
  authors:
  - Paul Erdős
  location: J. Indian Math. Soc. (N.S.) 12 (1948), 63-66
  type: paper
  relationship: independently-proves
  note: 'Proves the t = 2 case (irrationality of the Erdős–Borwein constant) by an
    elementary 2-adic order-counting argument. The formalized proof is different in
    method and covers every integer base; this entry independently proves the theorem
    of this paper as a special case. Full text read (Rényi Institute Erdős archive,
    1948-04).'
  author_endorsement: not-contacted
- title: On the irrationality of sum 1/(q^n + r)
  authors:
  - Peter Borwein
  id: https://doi.org/10.1016/s0022-314x(05)80041-1
  location: J. Number Theory 37 (1991), no. 3, 253-259
  type: paper
  relationship: independently-proves
  note: 'Proves irrationality of sum 1/(q^n + r) for every integer q >= 2 and rational
    r with q^n + r never zero, which contains the compared statement at r = -1. The
    formalized proof is of the same Padé family but follows the later orthogonal-
    polynomial presentation of Van Assche rather than this paper''s construction.'
  author_endorsement: not-contacted
- title: Little q-Legendre polynomials and irrationality of certain Lambert series
  authors:
  - Walter Van Assche
  id: https://arxiv.org/abs/math/0101187
  type: paper
  relationship: formalizes
  note: 'The proof formalized here follows this paper''s construction: little q-Legendre
    polynomials, their orthogonality, and the resulting Padé-type linear forms in 1 and
    the Lambert series value, with the clearing factor that makes the forms integral.
    The formalization is restricted to the integer-base Lambert series sum 1/(t^n - 1)
    and omits the paper''s other examples.'
  author_endorsement: not-contacted
- title: Arithmetical investigations of a certain infinite product
  authors:
  - Peter Bundschuh
  - Keijo Väänänen
  id: https://www.numdam.org/item/CM_1994__91_2_175_0/
  location: Compositio Math. 91 (1994), no. 2, 175-199
  type: paper
  relationship: independently-proves
  note: 'Theorem 2 gives a quantitative linear-independence measure for 1, E_q(-1),
    E_q''(-1) with E_q(z) = prod (1 + z q^{-j}), for q in a number field with a height
    condition; by logarithmic differentiation E_q''(-1)/E_q(-1) = sum 1/(q^n - 1), so
    the integer-base compared statement is the special case q in Z, |q| >= 2 (their
    Corollary 1), with an effective irrationality measure that the compared statement
    does not assert. Read in full from the open Numdam scan, 2026-08-27.'
  author_endorsement: not-contacted
- title: "A propos de la série sum_{n>=1} x^n/(q^n-1)"
  authors:
  - Daniel Duverney
  id: https://doi.org/10.5802/jtnb.163
  location: J. Théor. Nombres Bordeaux 8 (1996), no. 1, 173-181
  type: paper
  relationship: independently-proves
  note: 'Théorème 2: for q = r/s with r, s integers of Q or of an imaginary quadratic
    field and log|s|/log|r| < (1/3)(1 - 3/pi^2), the series sum 1/(q^n - 1) is not in
    the field, with an irrationality measure; the integer-base compared statement is
    the case s = 1. Read in full from the open Numdam scan, 2026-08-27.'
  author_endorsement: not-contacted
- title: 'Erdős problem #1049 (Chowla''s question: is sum 1/(t^n - 1) irrational for
    rational t > 1?)'
  id: https://www.erdosproblems.com/1049
  type: web discussion
  relationship: background
  note: 'The problem page records the integer-base case as settled and the rational
    non-integer case as open. The compared statement is the settled integer-base case
    only; it does not touch the open question. Read 2026-07-18.'
  author_endorsement: not-contacted
related_formalizations:
- id: https://github.com/leanprover-community/mathlib4
  relationship: independent
  note: Mathlib supplies Irrational, tsum over the positive naturals, and the real-number
    arithmetic used in the statement, so the Challenge introduces no definitions. Mathlib
    has no little q-Legendre polynomials, no q-orthogonality, and no theorem about this
    series; all of that is built in the supporting library.
- id: https://www.isa-afp.org/entries/Irrational_Series_Erdos_Straus.html
  relationship: independent
  note: 'Isabelle/AFP entry "Irrationality Criteria for Series by Erdős and Straus"
    (Koutsoukou-Argyraki and Li, 2020) formalizes general criteria for series of the form
    sum b_n / prod a_i. Checked 2026-08-27: it does not formalize the irrationality of
    sum 1/(t^n - 1) or of the Erdős–Borwein constant, and the compared statement does not
    follow from the criteria it formalizes without further work. Recorded as the nearest
    prior formalization found.'
status:
  scope: 'PROVED: for every integer t >= 2, sum_{n >= 1} 1/(t^n - 1) is irrational. NOT
    PROVED and NOT CLAIMED: irrationality for any rational non-integer base; any
    irrationality measure; any linear-independence or transcendence statement; and every
    other result in the author''s working notes on this series, none of which is
    advertised here.'
