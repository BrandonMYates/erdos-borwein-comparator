version: v0.4
project:
  name: Irrationality of the q-harmonic series at every integer base
  description: 'This project formalizes in Lean 4 the theorem that, for every integer
    t >= 2, the number sum_{n >= 1} 1/(t^n - 1) is irrational. At t = 2 this number is
    the Erdős–Borwein constant 1.60669515...; the series is the Lambert series of the
    divisor function, sum_{n >= 1} 1/(t^n - 1) = sum_{m >= 1} tau(m) t^{-m}. The
    t = 2 case is a theorem of Erdős (1948); the statement for every integer base is a
    theorem of P. Borwein (1991). The proof formalized here is not either of those
    proofs: it is the orthogonal-polynomial (Padé) proof of Van Assche (2001), which
    constructs explicit integer linear forms in 1 and the series value from the little
    q-Legendre polynomials and shows they tend to zero without vanishing. The compared
    statement is unconditional. Scope, stated plainly: only integer bases are covered.
    Irrationality for rational non-integer bases t = P/Q > 1 -- Chowla''s question,
    recorded as Erdős problem #1049 -- is NOT addressed and nothing here claims anything
    about it; no irrationality measure, linear-independence or transcendence statement
    is asserted. The audience is, first, the irrationality and Diophantine-approximation
    literature around the Erdős–Borwein constant (Erdős 1948; Borwein 1991, 1992;
    Bundschuh–Väänänen 1994; Duverney 1996; Van Assche 2001; Tachiya 2004; Bundschuh–Zudilin 2007; Luca–Tachiya 2014), for which
    this is, to the best of a targeted search recorded below, the first proof-assistant
    formalization; and second, the formalization community, since the supporting library
    contributes little q-Legendre polynomials, their orthogonality, and the associated
    Padé identity, none of which is in Mathlib. The search for prior formalizations was
    targeted, not exhaustive, and absence from search is not proof that none exists.'
  authors:
  - Brandon Yates
  license: Apache-2.0
  responsible_maintainers:
  - Brandon Yates
